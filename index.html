<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoPost AI - Hệ Thống Dịch Vụ & Quản Lý Nguyên Liệu</title>
    <style>
        /* Hiệu ứng LED RGB viền động */
        @keyframes rgb-border {
            0% { border-color: #ff0055; box-shadow: 0 8px 30px rgba(255, 0, 85, 0.15); }
            33% { border-color: #00b4d8; box-shadow: 0 8px 30px rgba(0, 180, 216, 0.15); }
            66% { border-color: #7209b7; box-shadow: 0 8px 30px rgba(114, 9, 183, 0.15); }
            100% { border-color: #ff0055; box-shadow: 0 8px 30px rgba(255, 0, 85, 0.15); }
        }

        @keyframes rgb-text {
            0% { color: #ff0055; }
            33% { color: #0077b6; }
            66% { color: #7209b7; }
            100% { color: #ff0055; }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8; /* Nền sáng hiện đại */
            color: #212529;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: #ffffff;
            border: 2px solid #ff0055;
            border-radius: 20px;
            padding: 30px;
            box-sizing: border-box;
            animation: rgb-border 6s infinite;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 25px;
            font-weight: 800;
            animation: rgb-text 6s infinite;
            letter-spacing: 0.5px;
        }

        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 12px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: #6c757d;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .tab-btn.active {
            color: #ffffff;
            background: linear-gradient(135deg, #ff0055, #7209b7);
            box-shadow: 0 4px 12px rgba(255, 0, 85, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #495057;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 10px;
            color: #212529;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #00b4d8;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.15);
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff0055, #7209b7);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3);
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.4);
        }

        .note {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
        }

        /* Bảng hiển thị thông tin kho tài khoản */
        .status-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .status-table th, .status-table td {
            border: 1px solid #dee2e6;
            padding: 10px 12px;
            text-align: left;
        }

        .status-table th {
            background-color: #e9ecef;
            color: #212529;
            font-weight: 700;
        }

        .status-table tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .badge-live {
            color: #2b8a3e;
            font-weight: bold;
            background: #ebfbee;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AUTOPOST AI - QUẢN LÝ HỆ THỐNG</h1>
        
        <!-- Thanh chuyển đổi tính năng -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'orderTab')">Tạo Dịch Vụ</button>
            <button class="tab-btn" onclick="switchTab(event, 'accountTab')">Kho Nguyên Liệu & Proxy</button>
        </div>

        <!-- TAB 1: TẠO ĐƠN DỊCH VỤ -->
        <div id="orderTab" class="tab-content active">
            <div class="form-group">
                <label>Chọn Nền Tảng & Dịch Vụ</label>
                <select id="serviceType">
                    <option value="fb_group">Facebook - Đăng Bài Nhóm Tự Động</option>
                    <option value="tiktok_like">TikTok - Tăng Tim / Follow</option>
                    <option value="ig_interact">Instagram - Tăng Tương Tác</option>
                </select>
            </div>

            <div class="form-group">
                <label>Đường Dẫn (Link Bài Viết / Nhóm / Kênh)</label>
                <input type="text" id="targetLink" placeholder="Dán link tại đây...">
            </div>

            <div class="form-group">
                <label>Số Lượng Cần Chạy</label>
                <input type="number" id="quantity" placeholder="Ví dụ: 30, 50, 100...">
            </div>

            <div class="form-group">
                <label>Độ Trễ Giữa Các Hành Động (Giây) - Chống Khóa Nick</label>
                <input type="number" id="delayTime" value="30" placeholder="Mặc định 30 giây">
                <div class="note">Giúp hệ thống giãn cách thời gian thực hiện, bảo vệ tài khoản khỏi bị checkpoint.</div>
            </div>

            <button class="btn-submit" onclick="submitOrder()">Tạo Đơn Hàng Ngay</button>
        </div>

        <!-- TAB 2: QUẢN LÝ KHO NGUYÊN LIỆU & PROXY -->
        <div id="accountTab" class="tab-content">
            <div class="form-group">
                <label>Chọn Nền Tảng Nguyên Liệu</label>
                <select id="accPlatform">
                    <option value="facebook">Facebook (Cookie / UID|Pass)</option>
                    <option value="tiktok">TikTok (Session Token)</option>
                    <option value="instagram">Instagram (Session ID)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Nhập Danh Sách Tài Khoản (Mỗi dòng 1 tài khoản)</label>
                <textarea id="accList" placeholder="Dán danh sách Cookie hoặc Session vào đây..."></textarea>
            </div>

            <div class="form-group">
                <label>Nhập Danh Sách Proxy Đi Kèm (Tương ứng 1 IP cho 1 tài khoản hoặc dải xoay)</label>
                <textarea id="proxyList" placeholder="Định dạng: IP:Port hoặc IP:Port:User:Pass..."></textarea>
                <div class="note">Giúp mỗi tài khoản tự động đổi một địa chỉ IP riêng biệt khi thao tác.</div>
            </div>

            <button class="btn-submit" onclick="saveAccounts()">Nạp Nguyên Liệu & Proxy</button>

            <!-- Bảng hiển thị thông tin tình trạng tài khoản -->
            <div style="margin-top: 25px;">
                <label style="font-weight: 700; margin-bottom: 8px; display: block;">Tình Trạng Kho Tài Khoản Hiện Tại</label>
                <table class="status-table">
                    <thead>
                    <tr>
                        <th>Nền Tảng</th>
                        <th>Tổng Số Nick</th>
                        <th>Trạng Thái</th>
                        <th>Proxy Sử Dụng</th>
                    </tr>
                    </thead>
                    <tbody id="statusTableBody">
                    <tr>
                        <td>Facebook</td>
                        <td>0</td>
                        <td><span class="badge-live" style="color: #6c757d; background: #e9ecef;">Chưa có dữ liệu</span></td>
                        <td>Chưa cấu hình</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Chuyển tab giao diện
        function switchTab(evt, tabId) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(c => c.classList.remove('active'));

            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(b => b.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        // Xử lý tạo đơn
        function submitOrder() {
            const link = document.getElementById('targetLink').value;
            const quantity = document.getElementById('quantity').value;
            const delay = document.getElementById('delayTime').value;

            if(!link || !quantity) {
                alert('Vui lòng nhập đầy đủ Link và Số lượng!');
                return;
            }

            alert(`Đã nhận đơn hàng thành công!\n- Độ trễ chống quét: ${delay} giây\n- Đang đưa vào hàng chờ xử lý.`);
        }

        // Xử lý lưu kho nguyên liệu và proxy
        function saveAccounts() {
            const platform = document.getElementById('accPlatform').value;
            const data = document.getElementById('accList').value;
            const proxy = document.getElementById('proxyList').value;

            if(!data.trim()) {
                alert('Danh sách tài khoản trống!');
                return;
            }

            // Đếm số lượng dòng tài khoản vừa nhập
            const totalAcc = data.trim().split('\n').length;
            const proxyStatus = proxy.trim() ? "Đã cấu hình Proxy" : "Dùng IP mặc định";

            // Cập nhật lên bảng trạng thái
            const tbody = document.getElementById('statusTableBody');
            tbody.innerHTML = `
                <tr>
                    <td>${platform.toUpperCase()}</td>
                    <td>${totalAcc}</td>
                    <td><span class="badge-live">LIVE (Sẵn sàng)</span></td>
                    <td>${proxyStatus}</td>
                </tr>
            `;

            alert(`Đã nạp thành công ${totalAcc} tài khoản và cấu hình Proxy cho ${platform.toUpperCase()}!`);
            document.getElementById('accList').value = '';
            document.getElementById('proxyList').value = '';
        }
    </script>

</body>
</html>
