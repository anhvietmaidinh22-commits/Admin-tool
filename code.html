<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mã Xác Nhận Nhiệm Vụ - TASKFLOW PRO</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  .box {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 28px 22px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
  }
  .code {
    font-size: 28px;
    font-weight: 900;
    color: #34d399;
    background: #064e3b;
    border: 1px solid #10b981;
    padding: 14px 12px;
    border-radius: 14px;
    margin: 16px 0;
    letter-spacing: 2px;
    word-break: break-all;
  }
  button {
    background: #10b981;
    color: #ffffff;
    border: none;
    padding: 12px 20px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 15px;
    width: 100%;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
  <div class="box">
    <div style="font-size:14px;color:#cbd5e1;">Hoàn thành vượt link! Mã xác nhận của bạn là:</div>
    <div id="codeBox" class="code">LM101</div>
    <button type="button" id="copyBtn" onclick="copyCleanCode()">Copy Mã Xác Nhận</button>
    <div style="font-size:12px;color:#94a3b8;margin-top:12px;">Quay lại web TASKFLOW PRO và dán mã này để nhận thưởng.</div>
  </div>
  <script>
    function extractCleanCode() {
      const params = new URLSearchParams(window.location.search);
      let raw = params.get('c') || '';
      if (!raw) {
        const href = window.location.href;
        const m = href.match(/[?&]c=([^&#]+)/i);
        raw = m ? decodeURIComponent(m[1]) : 'LM101';
      }
      const cleaned = String(raw)
        .split(/[\s\)\]\(\[\"'<>]+/)[0]
        .replace(/^https?:.*/i, '')
        .replace(/[^a-zA-Z0-9_-]/g, '')
        .toUpperCase();
      return cleaned || 'LM101';
    }

    const finalCode = extractCleanCode();
    document.getElementById('codeBox').textContent = finalCode;

    function copyCleanCode() {
      const btn = document.getElementById('copyBtn');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(finalCode).catch(() => {});
      }
      btn.textContent = 'Đã sao chép mã: ' + finalCode;
      setTimeout(() => { btn.textContent = 'Copy Mã Xác Nhận'; }, 2000);
    }
  </script>
</body>
</html>
