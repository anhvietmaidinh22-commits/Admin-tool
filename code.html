<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhận Mã Xác Nhận Ngẫu Nhiên - TASKFLOW PRO</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  .box {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 22px;
    padding: 28px 22px;
    max-width: 390px;
    width: 100%;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.38);
  }
  .sub { font-size: 13px; color: #94a3b8; margin-bottom: 14px; }
  .timer-box {
    font-size: 30px;
    font-weight: 900;
    color: #fbbf24;
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid rgba(245, 158, 11, 0.35);
    padding: 16px;
    border-radius: 16px;
    margin: 14px 0;
  }
  .code {
    font-size: 26px;
    font-weight: 900;
    color: #34d399;
    background: #064e3b;
    border: 1px solid #10b981;
    padding: 15px 12px;
    border-radius: 16px;
    margin: 14px 0;
    letter-spacing: 1.5px;
    word-break: break-all;
  }
  .btn-main {
    background: #10b981;
    color: #ffffff;
    border: none;
    padding: 13px 18px;
    border-radius: 13px;
    font-weight: 800;
    font-size: 15px;
    width: 100%;
    cursor: pointer;
  }
  .btn-sub {
    background: #334155;
    color: #e2e8f0;
    border: 1px solid #475569;
    padding: 10px 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 13px;
    width: 100%;
    cursor: pointer;
    margin-top: 8px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="box">
    <div style="font-size:18px;font-weight:900;">MÃ XÁC NHẬN NGẪU NHIÊN</div>
    <div class="sub">Đợi hết đếm ngược để lấy mã random và dán vào TASKFLOW PRO.</div>

    <div id="waitArea">
      <div class="timer-box">Mở khóa sau <span id="secCount">8</span>s</div>
      <div style="font-size:12px;color:#cbd5e1;">Đang tạo mã ngẫu nhiên cho phiên của bạn...</div>
    </div>

    <div id="codeArea" class="hidden">
      <div style="font-size:13px;color:#cbd5e1;">Mã random của bạn:</div>
      <div id="codeBox" class="code">---</div>
      <button type="button" class="btn-main" id="copyBtn" onclick="copyRandomCode()">Copy Mã Xác Nhận</button>
      <button type="button" class="btn-sub" onclick="rerollCode()">🎲 Đổi mã random khác</button>
    </div>
  </div>

  <script>
    function getBasePrefix() {
      const params = new URLSearchParams(window.location.search);
      let raw = params.get('c') || '';
      if (!raw) {
        const m = window.location.href.match(/[?&]c=([^&#]+)/i);
        raw = m ? decodeURIComponent(m[1]) : 'LM101';
      }
      const cleaned = String(raw)
        .split(/[\s\)\]\(\[\"'<>]+/)[0]
        .replace(/^https?:.*/i, '')
        .replace(/[^a-zA-Z0-9_-]/g, '')
        .toUpperCase();
      return cleaned || 'LM101';
    }

    function generateRandomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let rand = '';
      for (let i = 0; i < 4; i++) {
        rand += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return `${getBasePrefix()}-${rand}`;
    }

    let currentRandomCode = generateRandomCode();
    document.getElementById('codeBox').textContent = currentRandomCode;

    function rerollCode() {
      currentRandomCode = generateRandomCode();
      document.getElementById('codeBox').textContent = currentRandomCode;
      document.getElementById('copyBtn').textContent = 'Copy Mã Xác Nhận';
    }

    let left = 8;
    const secEl = document.getElementById('secCount');
    const iv = setInterval(() => {
      left -= 1;
      if (left > 0) {
        secEl.textContent = String(left);
      } else {
        clearInterval(iv);
        document.getElementById('waitArea').classList.add('hidden');
        document.getElementById('codeArea').classList.remove('hidden');
      }
    }, 1000);

    function copyRandomCode() {
      const btn = document.getElementById('copyBtn');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(currentRandomCode).catch(() => {});
      }
      btn.textContent = 'Đã sao chép: ' + currentRandomCode;
      setTimeout(() => { btn.textContent = 'Copy Mã Xác Nhận'; }, 2000);
    }
  </script>
</body>
</html>
