<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUBBA Pro Max System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header Pro Max -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-lg z-10">
        <div class="flex items-center space-x-4">
            <div class="relative">
                <img id="roomAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" class="w-11 h-11 rounded-2xl object-cover ring-2 ring-indigo-500/50 shadow-md" alt="Avatar">
                <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
            </div>
            <div>
                <h1 id="roomTitle" class="text-lg font-bold tracking-wide text-white">Phòng Tổng Đối Soát & Tương Tác</h1>
                <p class="text-xs text-emerald-400 font-medium flex items-center gap-1.5 mt-0.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 3000+ Clone đang hoạt động trực tuyến
                </p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="togglePinned()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-sm font-semibold transition border border-slate-700 flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-thumbtack text-amber-400"></i> Ghim Tin
            </button>
            <div class="flex items-center space-x-2 bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700 shadow-inner">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80" class="w-7 h-7 rounded-full object-cover" alt="Admin">
                <span id="currentUsername" class="text-sm font-bold text-indigo-400">QUẢN LÍ HỆ THỐNG</span>
            </div>
        </div>
    </header>

    <!-- Thanh Ghim Tin Nhắn -->
    <div id="pinnedBanner" class="hidden bg-slate-800/90 border-b border-slate-700/80 px-6 py-2.5 text-xs text-slate-300 flex justify-between items-center backdrop-blur-md">
        <div class="flex items-center space-x-2 truncate">
            <i class="fa-solid fa-thumbtack text-amber-400 shrink-0"></i>
            <span class="font-semibold text-slate-200">Tin ghim:</span>
            <span id="pinnedText" class="truncate text-slate-300">Chưa có tin nhắn ghim nào.</span>
        </div>
        <button onclick="togglePinned()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Main Container -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar Danh Sách Phòng -->
        <aside class="w-80 bg-slate-900/70 border-r border-slate-800 hidden md:flex flex-col">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Hệ Thống Phòng Chat</span>
                <button onclick="openCreateRoomModal()" class="text-indigo-400 hover:text-indigo-300 text-sm"><i class="fa-solid fa-plus-circle"></i></button>
            </div>
            <div id="roomList" class="flex-1 overflow-y-auto p-3 space-y-1.5">
                <div class="bg-indigo-600/20 border border-indigo-500/30 text-indigo-300 p-3 rounded-xl text-xs font-semibold">
                    🔥 Phòng Tổng Đối Soát & Tương Tác (3000 Clone Active)
                </div>
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="flex-1 flex flex-col bg-slate-950 relative">
            
            <!-- Khung Tin Nhắn -->
            <div id="chatMessages" class="flex-1 overflow-y-auto p-6 space-y-5">
                <!-- Tin nhắn render tự động từ Socket.io -->
            </div>

            <!-- Input Box Pro Max -->
            <div class="p-4 bg-slate-900 border-t border-slate-800 shadow-2xl">
                <form id="chatForm" onsubmit="sendMessage(event)" class="flex items-center space-x-3 max-w-5xl mx-auto">
                    <button type="button" class="text-slate-400 hover:text-slate-200 p-2.5 rounded-xl hover:bg-slate-800 transition"><i class="fa-regular fa-image text-lg"></i></button>
                    <input type="text" id="messageInput" autocomplete="off" placeholder="Nhập tin nhắn điều phối hệ thống..." class="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-5 py-3.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent shadow-inner transition">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3.5 rounded-2xl text-sm font-bold shadow-lg shadow-indigo-600/30 transition flex items-center gap-2">
                        <span>Gửi</span> <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Script kết nối Socket.io -->
    <script>
        const socket = io();
        let currentRoomId = 'room_general';
        let currentUser = 'QUẢN LÍ HỆ THỐNG';

        // Kho ảnh chân dung người thật phong cách châu Á/gần gũi cho clone
        const realAvatars = [
            'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=150&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1501196354995-cbb51c65aaea?w=150&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80'
        ];

        function getAvatarByName(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            let index = Math.abs(hash) % realAvatars.length;
            return realAvatars[index];
        }

        socket.on('connect', () => {
            socket.emit('join_room', currentRoomId);
        });

        socket.on('load_room_data', (data) => {
            renderMessages(data.messages);
            if(data.pinnedMsg) {
                document.getElementById('pinnedText').innerText = data.pinnedMsg;
                document.getElementById('pinnedBanner').classList.remove('hidden');
            } else {
                document.getElementById('pinnedBanner').classList.add('hidden');
            }
            if(data.roomName) document.getElementById('roomTitle').innerText = data.roomName;
            if(data.roomAvatarUrl) document.getElementById('roomAvatar').src = data.roomAvatarUrl;
        });

        socket.on('receive_message', (msg) => {
            appendMessage(msg);
        });

        socket.on('update_reaction', (data) => {
            const msgEl = document.getElementById('msg-' + data.msgId);
            if(msgEl) {
                let rxBox = msgEl.querySelector('.reaction-box');
                if(!rxBox) {
                    rxBox = document.createElement('div');
                    rxBox.className = 'reaction-box flex items-center gap-1.5 mt-1.5 text-xs';
                    msgEl.appendChild(rxBox);
                }
                rxBox.innerHTML = Object.entries(data.reactions).map(([user, emoji]) => `<span class="bg-slate-800 border border-slate-700/80 px-2 py-0.5 rounded-lg shadow-sm text-sm">${emoji}</span>`).join('');
            }
        });

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text) return;

            socket.emit('send_message', {
                roomId: currentRoomId,
                senderName: currentUser,
                text: text
            });
            input.value = '';
        }

        function appendMessage(msg) {
            const container = document.getElementById('chatMessages');
            const isMe = msg.senderName === currentUser || msg.senderName === 'QUẢN LÍ HỆ THỐNG';
            
            const div = document.createElement('div');
            div.id = 'msg-' + msg.id;
            div.className = `flex items-start space-x-3 max-w-xl ${isMe ? 'ml-auto flex-row-reverse space-x-reverse' : ''}`;

            let avatarUrl = isMe 
                ? 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80' 
                : getAvatarByName(msg.senderName || 'user');

            let reactionsHtml = '';
            if (msg.reactions && Object.keys(msg.reactions).length > 0) {
                reactionsHtml = `<div class="reaction-box flex items-center gap-1.5 mt-1.5 text-xs">` + 
                    Object.entries(msg.reactions).map(([user, emoji]) => `<span class="bg-slate-800 border border-slate-700/80 px-2 py-0.5 rounded-lg shadow-sm text-sm">${emoji}</span>`).join('') + 
                    `</div>`;
            }

            div.innerHTML = `
                <img src="${avatarUrl}" class="w-9 h-9 rounded-xl object-cover shrink-0 shadow-md border border-slate-700" alt="Avatar">
                <div class="${isMe ? 'items-end' : 'items-start'} flex flex-col">
                    <span class="text-xs font-semibold text-slate-400 mb-1 px-1">${msg.senderName}</span>
                    <div class="group relative px-4 py-3 rounded-2xl text-sm shadow-md leading-relaxed ${isMe ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-slate-900 border border-slate-800 text-slate-100 rounded-tl-none'}">
                        <div class="break-words">${msg.text}</div>
                    </div>
                    ${reactionsHtml}
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            messages.forEach(msg => appendMessage(msg));
            container.scrollTop = container.scrollHeight;
        }

        function togglePinned() {
            const banner = document.getElementById('pinnedBanner');
            banner.classList.toggle('hidden');
        }
    </script>
</body>
</html>
