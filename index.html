<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubba - Business Messaging & Bill Management</title>
    <!-- Favicon chuẩn từ logo của hệ thống -->
    <link rel="icon" href="/logo.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col">

    <!-- Header / Quick Switch Bar -->
    <header class="bg-blue-600 text-white px-4 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <img src="/logo.png" alt="Hubba Logo" class="w-10 h-10 rounded-full border-2 border-white shadow object-cover">
            <div>
                <h1 class="font-bold text-lg leading-tight">Hubba</h1>
                <span id="currentRoleBadge" class="bg-blue-500 text-[10px] px-2 py-0.5 rounded-full uppercase font-medium">Admin Tổng</span>
            </div>
        </div>
        
        <!-- Quick Switch Tài khoản -->
        <div class="flex items-center space-x-2">
            <span class="text-xs hidden sm:inline">Chuyển nhanh:</span>
            <select id="switchAccountSelect" class="bg-blue-700 text-white text-sm border border-blue-400 rounded px-2 py-1 outline-none font-medium">
                <!-- Dynamic options -->
            </select>
        </div>
    </header>

    <!-- Main App Layout -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar -->
        <div class="w-1/3 bg-white border-r border-slate-200 flex flex-col">
            <div class="p-3 border-b font-semibold text-slate-700 flex justify-between items-center text-sm">
                <span>Phòng Chat & Nhóm</span>
                <button onclick="openAdminModal()" id="adminConfigBtn" class="text-xs bg-slate-800 text-white px-2 py-1 rounded hidden hover:bg-slate-700">QL Chuyên Viên</button>
            </div>
            <div id="groupList" class="flex-1 overflow-y-auto divide-y divide-slate-100">
                <!-- Danh sách nhóm -->
            </div>
        </div>

        <!-- Chat Workspace -->
        <div class="flex-1 flex flex-col bg-slate-50">
            <!-- Header Nhóm -->
            <div class="bg-amber-50 border-b border-amber-200 px-4 py-2 text-xs text-amber-800 flex justify-between items-center">
                <span>📌 Nhóm làm việc và đối soát đơn hàng thời gian thực.</span>
                <span class="font-semibold text-green-600">Trạng thái: Hoạt động</span>
            </div>

            <!-- Khung Chat -->
            <div id="messageContainer" class="flex-1 p-4 overflow-y-auto space-y-3">
                <!-- Tin nhắn hiển thị ở đây -->
            </div>

            <!-- Input & Upload Bill -->
            <div class="p-3 bg-white border-t border-slate-200 flex items-center space-x-2">
                <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-2 rounded-lg text-sm flex items-center space-x-1">
                    <span>📷 Gửi Bill</span>
                    <input type="file" id="billInput" class="hidden">
                </label>
                <input type="text" id="messageInput" placeholder="Nhập tin nhắn hoặc nội dung đối soát..." class="flex-1 border border-slate-300 rounded-lg px-4 py-2 outline-none focus:border-blue-500 text-sm">
                <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-medium text-sm">Gửi</button>
            </div>
        </div>
    </div>

    <!-- Modal Admin Quản lý Chuyên Viên -->
    <div id="adminModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center">
        <div class="bg-white p-6 rounded-xl w-96 shadow-2xl">
            <h3 class="font-bold text-lg mb-4 text-slate-800">Tạo tài khoản Chuyên Viên mới</h3>
            <input type="text" id="newCvName" placeholder="Nhập tên chuyên viên (VD: Chuyên Viên C)..." class="w-full border border-slate-300 p-2.5 rounded-lg mb-4 outline-none focus:border-blue-500 text-sm">
            <div class="flex justify-end space-x-2">
                <button onclick="closeAdminModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg text-sm">Đóng</button>
                <button onclick="createSpecialist()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium">Tạo tài khoản</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUser = null;
        let usersData = [];
        let groupsData = [];
        let currentGroupId = 'group_general';

        async function initApp() {
            const res = await fetch('/api/init');
            const data = await res.json();
            usersData = data.users;
            groupsData = data.groups;
            
            currentUser = usersData[0];
            updateAccountSwitcher();
            renderGroups();
            socket.emit('join_group', currentGroupId);
            renderMessages(data.messages);
        }

        function updateAccountSwitcher() {
            const select = document.getElementById('switchAccountSelect');
            select.innerHTML = '';
            usersData.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.id;
                opt.textContent = `${u.avatar} ${u.username} (${u.role.toUpperCase()})`;
                if (u.id === currentUser.id) opt.selected = true;
                select.appendChild(opt);
            });

            const badge = document.getElementById('currentRoleBadge');
            const adminBtn = document.getElementById('adminConfigBtn');
            if (currentUser.role === 'admin') {
                badge.textContent = 'Admin Tổng';
                badge.className = 'bg-purple-600 text-[10px] px-2 py-0.5 rounded-full uppercase font-medium';
                adminBtn.classList.remove('hidden');
            } else {
                badge.textContent = 'Chuyên Viên';
                badge.className = 'bg-emerald-600 text-[10px] px-2 py-0.5 rounded-full uppercase font-medium';
                adminBtn.classList.add('hidden');
            }
        }

        document.getElementById('switchAccountSelect').addEventListener('change', (e) => {
            const selectedId = e.target.value;
            currentUser = usersData.find(u => u.id === selectedId);
            updateAccountSwitcher();
            alert(`Đã chuyển góc nhìn sang tài khoản: ${currentUser.username}`);
        });

        function renderGroups() {
            const list = document.getElementById('groupList');
            list.innerHTML = '';
            groupsData.forEach(g => {
                const div = document.createElement('div');
                div.className = `p-3 cursor-pointer hover:bg-slate-50 flex justify-between items-center text-sm ${g.id === currentGroupId ? 'bg-blue-50 border-l-4 border-blue-600 font-medium' : ''}`;
                div.innerHTML = `<span>💬 ${g.name}</span> <span class="text-xs text-slate-400">Active</span>`;
                div.onclick = () => {
                    currentGroupId = g.id;
                    socket.emit('join_group', currentGroupId);
                    renderGroups();
                };
                list.appendChild(div);
            });
        }

        function renderMessages(msgs) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = '';
            msgs.filter(m => m.groupId === currentGroupId).forEach(m => {
                const div = document.createElement('div');
                div.className = `flex flex-col ${m.senderId === currentUser.id ? 'items-end' : 'items-start'}`;
                div.innerHTML = `
                    <span class="text-xs text-slate-500 mb-1">${m.senderName} • ${m.time}</span>
                    <div class="max-w-md px-4 py-2 rounded-lg text-sm shadow-sm ${m.senderId === currentUser.id ? 'bg-blue-600 text-white' : 'bg-white border text-slate-800'}">
                        ${m.text}
                    </div>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const billInput = document.getElementById('billInput');
            const text = input.value.trim();
            const hasBill = billInput.files.length > 0;

            if (!text && !hasBill) return;

            let finalMsgText = text;
            if (hasBill) {
                finalMsgText += ` [📎 Đã tải lên ảnh hóa đơn/bill đối soát]`;
            }

            socket.emit('send_message', {
                groupId: currentGroupId,
                senderId: currentUser.id,
                senderName: currentUser.username,
                text: finalMsgText,
                hasBill: hasBill
            });

            input.value = '';
            billInput.value = '';
        }

        socket.on('receive_message', (msg) => {
            const container = document.getElementById('messageContainer');
            const div = document.createElement('div');
            div.className = `flex flex-col ${msg.senderId === currentUser.id ? 'items-end' : 'items-start'}`;
            div.innerHTML = `
                <span class="text-xs text-slate-500 mb-1">${msg.senderName} • ${msg.time}</span>
                <div class="max-w-md px-4 py-2 rounded-lg text-sm shadow-sm ${msg.senderId === currentUser.id ? 'bg-blue-600 text-white' : 'bg-white border text-slate-800'}">
                    ${msg.text}
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        });

        function openAdminModal() { document.getElementById('adminModal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); }

        async function createSpecialist() {
            const name = document.getElementById('newCvName').value.trim();
            if (!name) return;
            const res = await fetch('/api/specialists', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: name })
            });
            const data = await res.json();
            if (data.success) {
                usersData.push(data.user);
                updateAccountSwitcher();
                closeAdminModal();
                document.getElementById('newCvName').value = '';
                alert('Tạo chuyên viên thành công!');
            }
        }

        socket.on('update_users', (newUsers) => {
            usersData = newUsers;
            updateAccountSwitcher();
        });

        initApp();
    </script>
</body>
</html>
