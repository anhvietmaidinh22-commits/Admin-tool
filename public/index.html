<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hubba - Tổng Đài CSKH & Đối Soát Bill</title>
    <link rel="icon" href="/logo.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 h-[100dvh] flex flex-col font-sans select-none overflow-hidden m-0 p-0">

    <!---------------- MÀN HÌNH ĐĂNG NHẬP ---------------->
    <div id="authScreen" class="absolute inset-0 bg-blue-600 z-50 flex flex-col justify-center items-center p-6">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl flex flex-col items-center">
            <img src="/logo.png" alt="Hubba Logo" class="w-16 h-16 rounded-full shadow-md object-cover mb-3 border-2 border-blue-500">
            <h1 class="font-bold text-2xl text-slate-900 mb-1">Hubba CSKH</h1>
            <p class="text-xs text-slate-400 mb-6 text-center">Admin: <span class="font-bold text-blue-600">admin</span> / <span class="font-bold text-blue-600">123321</span></p>

            <div class="w-full space-y-3">
                <input type="text" id="authUsername" value="admin" placeholder="Tên đăng nhập" class="w-full bg-slate-100 border border-slate-200 px-4 py-3 rounded-xl text-sm outline-none focus:border-blue-500 font-medium">
                <input type="password" id="authPassword" value="123321" placeholder="Mật khẩu" class="w-full bg-slate-100 border border-slate-200 px-4 py-3 rounded-xl text-sm outline-none focus:border-blue-500 font-medium">
                
                <div id="authErrorMsg" class="text-red-500 text-xs text-center font-medium hidden"></div>

                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm shadow-md transition">Đăng Nhập</button>
                <button onclick="handleRegister()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl text-sm transition">Đăng Ký Khách Hàng Mới</button>
            </div>
        </div>
    </div>

    <!---------------- ỨNG DỤNG CHÍNH ---------------->
    <div id="mainAppContainer" class="flex-1 flex flex-col bg-white max-w-md mx-auto w-full h-full relative shadow-xl overflow-hidden hidden">

        <div class="flex-1 relative overflow-hidden flex flex-col">
            
            <!-- TAB 1: DANH SÁCH PHÒNG CHAT -->
            <div id="tabMessage" class="absolute inset-0 flex flex-col bg-white z-10">
                <div class="bg-white px-4 py-3 flex justify-between items-center border-b border-slate-100 shrink-0">
                    <div class="flex items-center space-x-2.5">
                        <img src="/logo.png" alt="Logo" class="w-8 h-8 rounded-full object-cover border">
                        <div>
                            <span id="headerTitle" class="font-bold text-base text-slate-900">Danh Sách Phòng Chat</span>
                            <p id="headerSubtitle" class="text-[10px] text-slate-500">Hệ thống CSKH real-time</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-2">
                        <button onclick="openRoomModal()" class="bg-blue-600 text-white text-xs font-bold px-2.5 py-2 rounded-xl shadow-sm">
                            <i class="fa-solid fa-user-plus"></i> Thêm Khách
                        </button>
                        <label id="batchUploadBtn" class="cursor-pointer bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-2.5 py-2 rounded-xl shadow-sm flex items-center space-x-1 transition hidden">
                            <i class="fa-solid fa-file-arrow-up"></i>
                            <span>Up Bill Loạt</span>
                            <input type="file" id="batchBillInput" accept="image/*" multiple class="hidden" onchange="handleBatchBills(event)">
                        </label>
                    </div>
                </div>
                <div id="roomList" class="flex-1 overflow-y-auto divide-y divide-slate-50"></div>
            </div>

            <!-- TAB 2: QUẢN LÝ NHÂN SỰ -->
            <div id="tabStaff" class="absolute inset-0 flex flex-col bg-slate-50 z-0 hidden">
                <div class="bg-white px-4 py-3 border-b border-slate-100 flex justify-between items-center shrink-0">
                    <span class="font-bold text-lg text-slate-900">Quản Lý Nhân Sự</span>
                    <button onclick="openStaffModal()" class="bg-blue-600 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-sm">
                        <i class="fa-solid fa-user-plus mr-1"></i> Thêm Chuyên Viên
                    </button>
                </div>
                <div id="staffList" class="p-4 space-y-3 overflow-y-auto flex-1"></div>
            </div>

            <!-- TAB 3: CÁ NHÂN & CHUYỂN ĐỔI NHANH TÀI KHOẢN (SWITCH ACCOUNT) -->
            <div id="tabProfile" class="absolute inset-0 flex flex-col bg-slate-50 z-0 hidden">
                <div class="bg-white px-4 py-3 border-b border-slate-100 font-bold text-lg text-slate-900 shrink-0">Cá nhân hệ thống</div>
                
                <div class="bg-white p-4 flex items-center space-x-4 mt-2 border-y border-slate-100 shrink-0">
                    <img src="/logo.png" alt="Avatar" class="w-14 h-14 rounded-full border shadow-sm object-cover">
                    <div class="flex-1 min-w-0">
                        <h3 id="profileName" class="font-bold text-slate-900 text-base truncate">User</h3>
                        <p id="profileRole" class="text-xs text-blue-600 font-medium mt-0.5">Quyền</p>
                    </div>
                </div>

                <!-- Khu vực chuyển đổi nhanh tài khoản trực tiếp trên app -->
                <div class="p-4 space-y-3 flex-1 overflow-y-auto">
                    <h4 class="font-bold text-xs text-slate-500 uppercase tracking-wider">⚡ Chuyển Đổi Nhanh Tài Khoản</h4>
                    <div id="quickSwitchList" class="space-y-2">
                        <!-- Danh sách tài khoản sẽ được render bằng JS -->
                    </div>
                </div>

                <div class="p-4 bg-white border-t border-slate-200">
                    <button onclick="handleLogout()" class="w-full bg-white border border-red-200 text-red-600 font-bold py-3 rounded-2xl text-sm shadow-sm hover:bg-red-50 transition">Đăng Xuất Hoàn Toàn</button>
                </div>
            </div>

        </div>

        <!---------------- KHUNG CHAT CHI TIẾT ---------------->
        <div id="chatRoomView" class="absolute inset-0 bg-white z-30 flex flex-col transform translate-x-full transition-transform duration-300">
            <div class="bg-blue-600 text-white px-4 py-3 flex items-center justify-between shrink-0 shadow-sm">
                <div class="flex items-center space-x-3">
                    <button onclick="closeChatRoom()" class="text-white text-lg px-1"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="flex items-center space-x-2">
                        <img src="/logo.png" alt="Logo" class="w-7 h-7 rounded-full object-cover border border-white/50">
                        <div>
                            <h3 id="activeRoomName" class="font-bold text-sm leading-tight">Phòng Hỗ Trợ</h3>
                            <span id="activeRoomStatus" class="text-[10px] text-emerald-200">Trực tuyến (Admin & Chuyên viên)</span>
                        </div>
                    </div>
                </div>
            </div>
            <div id="messageContainer" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50"></div>
            <div class="p-2.5 bg-white border-t border-slate-200 flex items-center space-x-2 shrink-0">
                <input type="text" id="messageInput" placeholder="Nhập tin nhắn..." class="flex-1 bg-slate-100 border border-slate-200 rounded-full px-4 py-2.5 outline-none text-xs sm:text-sm text-slate-800">
                <button onclick="sendMessage()" class="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center text-sm shadow-sm shrink-0 hover:bg-blue-700 transition">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!---------------- THANH NAVIGATION BAR ---------------->
        <div id="navBarContainer" class="bg-white border-t border-slate-200 h-14 flex justify-around items-center shrink-0 z-20 w-full shadow-lg">
            <button onclick="switchTab('message')" id="navMsg" class="flex flex-col items-center justify-center flex-1 text-blue-600 transition py-1">
                <i class="fa-solid fa-comments text-base"></i>
                <span class="text-[10px] mt-0.5 font-medium">Hỗ trợ</span>
            </button>
            <button onclick="switchTab('staff')" id="navStaff" class="flex flex-col items-center justify-center flex-1 text-slate-400 transition py-1 hidden">
                <i class="fa-solid fa-users-gear text-base"></i>
                <span class="text-[10px] mt-0.5 font-medium">Nhân sự</span>
            </button>
            <button onclick="switchTab('profile')" id="navProfile" class="flex flex-col items-center justify-center flex-1 text-slate-400 transition py-1">
                <i class="fa-solid fa-user text-base"></i>
                <span class="text-[10px] mt-0.5 font-medium">Cá nhân</span>
            </button>
        </div>

    </div>

    <!-- Modal Thêm Khách Vào Phòng Chat -->
    <div id="roomModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-5 rounded-2xl w-full max-w-sm shadow-2xl space-y-3">
            <h3 class="font-bold text-base text-slate-900">Thêm Khách Vào Phòng Chat</h3>
            <input type="text" id="roomNameInput" placeholder="Tên phòng (VD: Hỗ trợ A)..." class="w-full bg-slate-100 border-none p-3 rounded-xl outline-none text-sm text-slate-800">
            <input type="text" id="clientNameInput" placeholder="Tên khách hàng..." class="w-full bg-slate-100 border-none p-3 rounded-xl outline-none text-sm text-slate-800">
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeRoomModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-medium text-slate-600">Đóng</button>
                <button onclick="createRoomWithClient()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-medium">Tạo & Thêm</button>
            </div>
        </div>
    </div>

    <!-- Modal Thêm Nhân Sự -->
    <div id="staffModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-5 rounded-2xl w-full max-w-sm shadow-2xl space-y-3">
            <h3 class="font-bold text-base text-slate-900">Thêm Tài Khoản Chuyên Viên</h3>
            <input type="text" id="newStaffUser" placeholder="Tên đăng nhập..." class="w-full bg-slate-100 border-none p-3 rounded-xl outline-none text-sm text-slate-800">
            <input type="password" id="newStaffPass" placeholder="Mật khẩu..." class="w-full bg-slate-100 border-none p-3 rounded-xl outline-none text-sm text-slate-800">
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeStaffModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-medium text-slate-600">Đóng</button>
                <button onclick="createSpecialist()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-medium">Xác Nhận</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUser = null;
        let roomsData = [];
        let usersData = [];
        let currentRoomId = null;

        async function handleLogin() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const errDiv = document.getElementById('authErrorMsg');

            if(!username || !password) {
                errDiv.textContent = 'Vui lòng nhập tài khoản và mật khẩu!';
                errDiv.classList.remove('hidden');
                return;
            }

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if(data.success) {
                currentUser = data.user;
                roomsData = data.rooms;
                usersData = data.users;
                startApp();
            } else {
                errDiv.textContent = data.message;
                errDiv.classList.remove('hidden');
            }
        }

        async function handleRegister() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const errDiv = document.getElementById('authErrorMsg');

            if(!username || !password) {
                errDiv.textContent = 'Vui lòng nhập tài khoản và mật khẩu!';
                errDiv.classList.remove('hidden');
                return;
            }

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if(data.success) {
                alert('Đăng ký khách hàng thành công! Hãy đăng nhập.');
                errDiv.classList.add('hidden');
            } else {
                errDiv.textContent = data.message;
                errDiv.classList.remove('hidden');
            }
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById('mainAppContainer').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
        }

        // Chuyển đổi nhanh tài khoản trực tiếp ngay trên app mà không cần login lại
        function switchAccount(userId) {
            const targetUser = usersData.find(u => u.id === userId);
            if(targetUser) {
                currentUser = { id: targetUser.id, username: targetUser.username, role: targetUser.role };
                startApp();
                switchTab('message');
                alert(`Đã chuyển sang tài khoản: ${targetUser.username} (${targetUser.role.toUpperCase()})`);
            }
        }

        function startApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainAppContainer').classList.remove('hidden');
            
            document.getElementById('profileName').textContent = currentUser.username;
            document.getElementById('profileRole').textContent = `Vai trò: ${currentUser.role.toUpperCase()}`;

            if(currentUser.role === 'admin') {
                document.getElementById('navStaff').classList.remove('hidden');
                document.getElementById('batchUploadBtn').classList.remove('hidden');
            } else if(currentUser.role === 'specialist') {
                document.getElementById('navStaff').classList.add('hidden');
                document.getElementById('batchUploadBtn').classList.remove('hidden');
            } else {
                document.getElementById('navStaff').classList.add('hidden');
                document.getElementById('batchUploadBtn').classList.add('hidden');
            }

            renderRooms();
            renderStaff();
            renderQuickSwitchList();
        }

        socket.on('update_data', (data) => {
            roomsData = data.rooms;
            usersData = data.users;
            renderRooms();
            renderStaff();
            renderQuickSwitchList();
        });

        function renderQuickSwitchList() {
            const container = document.getElementById('quickSwitchList');
            container.innerHTML = '';
            usersData.forEach(u => {
                const isCurrent = currentUser && currentUser.id === u.id;
                const div = document.createElement('div');
                div.className = `p-3 rounded-xl flex items-center justify-between border cursor-pointer transition ${isCurrent ? 'bg-blue-50 border-blue-300 shadow-sm' : 'bg-white border-slate-200 hover:bg-slate-50'}`;
                div.innerHTML = `
                    <div class="flex items-center space-x-2.5">
                        <span class="text-lg">${u.avatar || '👤'}</span>
                        <div>
                            <p class="font-bold text-xs text-slate-800">${u.username}</p>
                            <span class="text-[9px] uppercase font-semibold text-slate-400">${u.role}</span>
                        </div>
                    </div>
                    <span class="text-xs font-bold ${isCurrent ? 'text-blue-600' : 'text-slate-400'}">${isCurrent ? 'Đang dùng' : 'Chuyển'}</span>
                `;
                if(!isCurrent) {
                    div.onclick = () => switchAccount(u.id);
                }
                container.appendChild(div);
            });
        }

        function openRoomModal() { document.getElementById('roomModal').classList.remove('hidden'); }
        function closeRoomModal() { document.getElementById('roomModal').classList.add('hidden'); }

        async function createRoomWithClient() {
            const name = document.getElementById('roomNameInput').value.trim();
            const clientName = document.getElementById('clientNameInput').value.trim();
            if(!name || !clientName) return alert('Nhập đủ thông tin!');

            const res = await fetch('/api/create-room', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, clientName, specialistName: currentUser.role === 'specialist' ? currentUser.username : 'Chưa phân công' })
            });
            const data = await res.json();
            if(data.success) {
                closeRoomModal();
                document.getElementById('roomNameInput').value = '';
                document.getElementById('clientNameInput').value = '';
                alert('Thêm phòng và khách thành công!');
            }
        }

        async function handleBatchBills(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            let billNames = [];
            for (let i = 0; i < files.length; i++) {
                billNames.push(files[i].name);
            }

            const res = await fetch('/api/auto-clone-bills', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ billNames })
            });
            const data = await res.json();

            if (data.success) {
                alert(`Đã tự động clone thành công ${data.count} phòng từ bill!`);
                event.target.value = '';
            }
        }

        function renderRooms() {
            const list = document.getElementById('roomList');
            list.innerHTML = '';

            let displayRooms = [];
            if (currentUser.role === 'admin') {
                displayRooms = roomsData;
            } else if (currentUser.role === 'specialist') {
                displayRooms = roomsData.filter(r => r.assignedSpecialist === currentUser.username || r.isCustomGroup || r.id === 'room_general');
            } else {
                displayRooms = roomsData.filter(r => r.clientId === currentUser.id);
            }

            if(displayRooms.length === 0) {
                list.innerHTML = `<div class="p-6 text-center text-slate-400 text-xs">Chưa có phòng hỗ trợ nào.</div>`;
                return;
            }

            displayRooms.forEach(r => {
                const div = document.createElement('div');
                div.className = "px-4 py-3.5 flex items-center justify-between hover:bg-slate-50 transition border-b border-slate-50";
                
                let actionHtml = '';
                if (currentUser.role === 'admin' && r.clientId) {
                    let specialistOptions = '<option value="">-- Chọn Chuyên viên --</option>';
                    usersData.filter(u => u.role === 'specialist').forEach(sp => {
                        const selected = r.assignedSpecialist === sp.username ? 'selected' : '';
                        specialistOptions += `<option value="${sp.username}" ${selected}>${sp.username}</option>`;
                    });

                    actionHtml = `
                        <div class="flex items-center space-x-2" onclick="event.stopPropagation()">
                            <select onchange="assignSpecialist('${r.id}', this.value)" class="bg-blue-50 text-blue-700 text-xs font-bold rounded-lg px-2 py-1.5 border border-blue-200 outline-none">
                                ${specialistOptions}
                            </select>
                        </div>
                    `;
                } else {
                    actionHtml = `<span class="text-[10px] px-2 py-1 rounded-full font-medium bg-emerald-100 text-emerald-700">${r.assignedSpecialist ? 'Phụ trách: ' + r.assignedSpecialist : 'Đang chờ'}</span>`;
                }

                div.innerHTML = `
                    <div class="flex items-center space-x-3 flex-1 min-w-0 cursor-pointer" onclick="openRoom('${r.id}', '${r.name}')">
                        <img src="/logo.png" alt="Logo" class="w-12 h-12 rounded-full object-cover border shrink-0 shadow-sm">
                        <div class="flex-1 min-w-0 pr-2">
                            <h4 class="font-bold text-slate-900 text-sm truncate">${r.name}</h4>
                            <p class="text-xs text-slate-500 truncate mt-0.5">Nhấn để vào phòng chat trực tuyến...</p>
                        </div>
                    </div>
                    ${actionHtml}
                `;
                list.appendChild(div);
            });
        }

        function renderStaff() {
            const list = document.getElementById('staffList');
            list.innerHTML = '';
            usersData.forEach(u => {
                const div = document.createElement('div');
                div.className = "bg-white p-3.5 rounded-2xl flex items-center justify-between shadow-sm border border-slate-100";
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <img src="/logo.png" alt="Logo" class="w-10 h-10 rounded-full object-cover border">
                        <div>
                            <h4 class="font-bold text-slate-800 text-sm">${u.username}</h4>
                            <span class="text-[10px] px-2 py-0.5 rounded-full uppercase font-semibold ${u.role==='admin'?'bg-purple-100 text-purple-700':'bg-emerald-100 text-emerald-700'}">${u.role}</span>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function assignSpecialist(roomId, specialistName) {
            if(!specialistName) return;
            await fetch('/api/assign-room', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomId, specialistName })
            });
        }

        function openStaffModal() { document.getElementById('staffModal').classList.remove('hidden'); }
        function closeStaffModal() { document.getElementById('staffModal').classList.add('hidden'); }

        async function createSpecialist() {
            const username = document.getElementById('newStaffUser').value.trim();
            const password = document.getElementById('newStaffPass').value.trim();
            if(!username || !password) return alert('Nhập đủ thông tin!');

            const res = await fetch('/api/create-specialist', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if(data.success) {
                closeStaffModal();
                document.getElementById('newStaffUser').value = '';
                document.getElementById('newStaffPass').value = '';
                alert('Tạo tài khoản chuyên viên thành công!');
            } else {
                alert(data.message);
            }
        }

        function openRoom(roomId, roomName) {
            currentRoomId = roomId;
            document.getElementById('activeRoomName').textContent = roomName;
            socket.emit('join_room', currentRoomId);
            document.getElementById('chatRoomView').classList.remove('translate-x-full');
        }

        function closeChatRoom() {
            document.getElementById('chatRoomView').classList.add('translate-x-full');
        }

        socket.on('load_messages', (msgs) => { renderMessages(msgs); });

        function renderMessages(msgs) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = '';
            msgs.forEach(m => {
                const isMe = m.senderName === currentUser.username;
                const div = document.createElement('div');
                div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                
                let billHtml = '';
                if(m.billInfo) {
                    billHtml = `
                        <div class="mt-2 bg-emerald-50 border border-emerald-200 p-2.5 rounded-xl text-xs text-emerald-800 space-y-1">
                            <p class="font-bold">🧾 KẾT QUẢ BÓC TÁCH OCR TỰ ĐỘNG:</p>
                            <p>Mã Giao Dịch: <span class="font-mono font-bold">${m.billInfo.code}</span></p>
                            <p>Số Tiền: <span class="font-bold text-blue-600">${m.billInfo.amount}</span></p>
                            <p class="font-semibold text-emerald-600">${m.billInfo.status}</p>
                        </div>
                    `;
                }

                div.innerHTML = `
                    <span class="text-[10px] text-slate-400 px-1 mb-0.5">${m.senderName} • ${m.time}</span>
                    <div class="max-w-[85%] px-4 py-2.5 rounded-2xl text-xs sm:text-sm shadow-sm break-words ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white border border-slate-100 text-slate-800 rounded-bl-none'}">
                        ${m.text}
                        ${billHtml}
                    </div>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            socket.emit('send_message', {
                roomId: currentRoomId,
                senderName: currentUser.username,
                text: text
            });

            input.value = '';
        }

        socket.on('receive_message', (msg) => {
            if(msg.roomId === currentRoomId) {
                const container = document.getElementById('messageContainer');
                const isMe = msg.senderName === currentUser.username;
                const div = document.createElement('div');
                div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                
                let billHtml = '';
                if(msg.billInfo) {
                    billHtml = `
                        <div class="mt-2 bg-emerald-50 border border-emerald-200 p-2.5 rounded-xl text-xs text-emerald-800 space-y-1">
                            <p class="font-bold">🧾 KẾT QUẢ BÓC TÁCH OCR TỰ ĐỘNG:</p>
                            <p>Mã Giao Dịch: <span class="font-mono font-bold">${msg.billInfo.code}</span></p>
                            <p>Số Tiền: <span class="font-bold text-blue-600">${msg.billInfo.amount}</span></p>
                            <p class="font-semibold text-emerald-600">${msg.billInfo.status}</p>
                        </div>
                    `;
                }

                div.innerHTML = `
                    <span class="text-[10px] text-slate-400 px-1 mb-0.5">${msg.senderName} • ${msg.time}</span>
                    <div class="max-w-[85%] px-4 py-2.5 rounded-2xl text-xs sm:text-sm shadow-sm break-words ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white border border-slate-100 text-slate-800 rounded-bl-none'}">
                        ${msg.text}
                        ${billHtml}
                    </div>
                `;
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            }
        });

        function switchTab(tabName) {
            document.getElementById('tabMessage').classList.add('hidden');
            document.getElementById('tabStaff').classList.add('hidden');
            document.getElementById('tabProfile').classList.add('hidden');

            document.getElementById('navMsg').className = "flex flex-col items-center justify-center flex-1 text-slate-400 transition py-1";
            document.getElementById('navStaff').className = "flex flex-col items-center justify-center flex-1 text-slate-400 transition py-1";
            document.getElementById('navProfile').className = "flex flex-col items-center justify-center flex-1 text-slate-400 transition py-1";

            if(tabName === 'message') {
                document.getElementById('tabMessage').classList.remove('hidden');
                document.getElementById('navMsg').className = "flex flex-col items-center justify-center flex-1 text-blue-600 transition py-1";
            } else if(tabName === 'staff') {
                document.getElementById('tabStaff').classList.remove('hidden');
                document.getElementById('navStaff').className = "flex flex-col items-center justify-center flex-1 text-blue-600 transition py-1";
            } else if(tabName === 'profile') {
                document.getElementById('tabProfile').classList.remove('hidden');
                document.getElementById('navProfile').className = "flex flex-col items-center justify-center flex-1 text-blue-600 transition py-1";
            }
        }
    </script>
</body>
</html>
