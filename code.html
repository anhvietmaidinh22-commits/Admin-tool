<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mã Xác Nhận Nhiệm Vụ - TASKFLOW PRO</title>
<style>
  body { font-family: sans-serif; background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 28px 22px; max-width: 380px; width: 100%; }
  .code { font-size: 30px; font-weight: 900; color: #34d399; background: #064e3b; padding: 14px; border-radius: 14px; margin: 16px 0; letter-spacing: 2px; }
  button { background: #10b981; color: #fff; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 800; font-size: 15px; width: 100%; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <div style="font-size:14px;color:#94a3b8;">Hoàn thành vượt link! Mã xác nhận của bạn là:</div>
    <div id="codeBox" class="code">LM889</div>
    <button onclick="navigator.clipboard.writeText(document.getElementById('codeBox').textContent);this.textContent='Đã sao chép mã!'">Copy Mã Xác Nhận</button>
    <div style="font-size:12px;color:#94a3b8;margin-top:12px;">Quay lại web TASKFLOW PRO và dán mã này để nhận thưởng.</div>
  </div>
  <script>
    const c = new URLSearchParams(location.search).get('c');
    if (c) document.getElementById('codeBox').textContent = c.toUpperCase();
  </script>
</body>
</html>
